name: IG watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ig-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ig-state-${{ github.run_id }}
          restore-keys: ig-state-

      - name: Check profiles
        env:
          IG_USERNAMES: ${{ secrets.IG_USERNAMES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Save status
        uses: actions/cache/save@v4
        with:
          path: state
          key: ig-state-${{ github.run_id }}
